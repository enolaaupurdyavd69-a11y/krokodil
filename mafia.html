<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#140f1f">
  <title>Мафия 18+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=swap">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ground: #140f1f; --screen: #1d1530; --raise: #2a1f44; --line: #3a2d5c;
      --fg: #f3eefc; --muted: #a99cc6; --pink: #ff4fa3; --amber: #ffb547; --ok: #3ddc97; --bad: #ff6b6b; --blue: #2aabee;
      --role: var(--pink); --hero: var(--pink);
      --display: "Unbounded", "Arial Black", system-ui, sans-serif;
      --body: "Manrope", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ground); color: var(--fg); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    main { max-width: 480px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
    .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
    p { margin: 0; line-height: 1.5; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    .top { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
    .top h1 { font-size: 24px; }
    .timer { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--pink); font-size: 18px; white-space: nowrap; }
    .timer.over { color: var(--muted); }

    /* главное событие фазы */
    .hero { border-radius: 24px; padding: 22px 18px; display: grid; gap: 12px; text-align: center; justify-items: center;
            background: radial-gradient(120% 90% at 50% -20%, color-mix(in srgb, var(--hero) 32%, transparent), transparent 62%), var(--raise);
            border: 1px solid color-mix(in srgb, var(--hero) 45%, var(--line)); animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
    .hero .big { font-size: 56px; line-height: 1; animation: pop .6s .1s cubic-bezier(.2,1.4,.4,1) both; }
    .hero h2 { font-size: 22px; color: var(--hero); }
    .people { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .person { display: grid; justify-items: center; gap: 6px; width: 92px; animation: rise .5s both; }
    .person .av { width: 60px; height: 60px; font-size: 24px; position: relative; }
    .person .av::after { content: '💀'; position: absolute; right: -6px; bottom: -6px; font-size: 22px; }
    .person b { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .person span { font-size: 12px; }
    .tally { width: 100%; display: grid; gap: 6px; text-align: left; }
    .bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 13px; position: relative; padding: 6px 10px; border-radius: 10px; overflow: hidden; background: var(--screen); }
    .bar i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--hero) 30%, transparent); transform-origin: left; animation: grow .8s .2s both; }
    .bar span, .bar b { position: relative; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

    .av { border-radius: 50%; display: grid; place-items: center; font: 800 18px var(--display); color: var(--ground); flex: none; }

    .panel { background: var(--raise); border-radius: 20px; padding: 16px; display: grid; gap: 12px; border: 1px solid var(--line); }
    .panel h2 { font-size: 16px; font-family: var(--body); font-weight: 700; }
    .targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .target { border: 2px solid var(--line); background: var(--screen); color: var(--fg); border-radius: 16px; padding: 12px 6px;
              display: grid; gap: 6px; justify-items: center; font: 600 13px var(--body); cursor: pointer; }
    .target .av { width: 44px; height: 44px; }
    .target .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .target.on { border-color: var(--role); background: color-mix(in srgb, var(--role) 18%, var(--screen)); }
    .target:focus-visible, .send:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .send { border: 0; border-radius: 16px; padding: 16px; font: 600 15px var(--display); background: var(--pink); color: #fff; cursor: pointer; }
    .send:disabled { opacity: .4; }
    .send.ghost { background: var(--screen); color: var(--fg); border: 1px solid var(--line); }
    .err { color: var(--bad); font-size: 13px; }
    .err:empty { display: none; }

    .note { background: var(--raise); border-radius: 16px; padding: 14px 16px; line-height: 1.5; border: 1px solid var(--line); }
    .note.me { border-color: color-mix(in srgb, var(--amber) 60%, var(--line)); }
    .note.dead { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); }

    details.role { background: var(--raise); border-radius: 20px; border: 1px solid color-mix(in srgb, var(--role) 45%, var(--line)); overflow: hidden; }
    details.role summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    details.role summary::-webkit-details-marker { display: none; }
    details.role summary .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px;
                               background: color-mix(in srgb, var(--role) 22%, var(--ground)); border: 2px solid var(--role); }
    details.role summary b { color: var(--role); font-family: var(--display); font-size: 15px; }
    details.role summary small { margin-left: auto; color: var(--muted); }
    details.role[open] summary small { visibility: hidden; }
    details.role .body { padding: 0 16px 16px; display: grid; gap: 8px; }
    .goal { font-size: 13px; color: var(--muted); }
    .mates { font-weight: 700; color: var(--bad); }

    .town { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .town div { display: flex; align-items: center; gap: 8px; background: var(--screen); border-radius: 12px; padding: 8px 10px; font-size: 13px; min-width: 0; border: 1px solid transparent; }
    .town div.self { border-color: var(--line); }
    .town .av { width: 28px; height: 28px; font-size: 12px; }
    .town .dead .av { opacity: .4; }
    .town .who { min-width: 0; display: grid; }
    .town .who b, .town .who small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .town .who b { font-weight: 600; }
    .town .dead b { color: var(--muted); }
    .town small { font-size: 11px; }
    .hint { font-size: 12px; color: var(--muted); text-align: center; }
    .bar-top { display: flex; gap: 8px; }
    .chip { flex: 1; border: 1px solid var(--line); background: var(--screen); color: var(--fg); border-radius: 12px; padding: 10px 8px;
            font: 600 13px var(--body); cursor: pointer; text-align: center; }
    .chip.quit { color: var(--bad); }
    .chip:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  </style>
</head>
<body>
<main id="app"><p class="muted">Загрузка…</p></main>
<script>
'use strict';
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const ROLES = {
    mafia:   ['🔪', 'Мафия', '#ff6b6b', 'Ночью вместе с семьёй выбираете, кого убрать. Днём притворяйтесь приличным человеком.'],
    don:     ['🎩', 'Дон мафии', '#ffb547', 'Голосуете с семьёй за убийство, при равенстве решает ваш голос. Каждую ночь можете проверить одного игрока: не комиссар ли он.'],
    doctor:  ['💉', 'Доктор', '#3ddc97', 'Ночью лечите одного игрока — если на него нападут, он выживет. Одного и того же два раза подряд нельзя, себя — только один раз за игру.'],
    sheriff: ['🚓', 'Комиссар', '#2aabee', 'Каждую ночь проверяете одного игрока: мафия он или нет. Днём решайте сами, выдавать себя или нет.'],
    lover:   ['💋', 'Путана', '#ff4fa3', 'Ночью «обслуживаете» одного игрока — ему не до дел: его ночное действие срывается. Мужа Ревнивой жены лучше не трогать.'],
    voyeur:  ['👀', 'Вуайерист', '#5ed6d6', 'Ночью подглядываете за одним игроком и узнаёте, кто к нему приходил.'],
    stripper:['💃', 'Стриптизёрша', '#f06292', 'Ночью танцуете для одного игрока — днём он так впечатлён, что не может голосовать.'],
    wife:    ['💍', 'Ревнивая жена', '#ffd666', 'У вас тайный муж. Если к нему ночью заглянет Путана — вы с ней расправитесь. Играете за себя.'],
    bartender:['🍸', 'Бармен', '#e65050', 'Вы в мафии. Ночью подпаиваете игрока: у пьяного Комиссара проверка лжёт, пьяный Доктор никого не вылечит.'],
    maniac:  ['🪓', 'Маньяк', '#ff7a45', 'Играете сам за себя. Каждую ночь убиваете одного игрока. Побеждаете, если останетесь один на один с мирным.'],
    civil:   ['🙂', 'Мирный житель', '#b388ff', 'Ночью спите. Днём ищете мафию и голосуете с умом.'],
  };
  const GOALS = { mafia: 'Цель: мафии должно стать не меньше, чем остальных.', don: 'Цель: мафии должно стать не меньше, чем остальных.',
                  bartender: 'Цель: мафии должно стать не меньше, чем остальных.',
                  maniac: 'Цель: остаться в живых последним, не считая одного мирного.',
                  wife: 'Цель: дожить до конца вместе с мужем — тогда вы побеждаете при любом исходе.' };
  const TASKS = { kill: '🔪 Кого семья убирает?', doncheck: '🎩 Кого проверить: не комиссар ли?', heal: '💉 Кого лечите?',
                  check: '🚓 Кого проверяете?', visit: '💋 К кому заглянете?', maniac: '🪓 К кому зайти с топором?',
                  watch: '👀 За кем подглядываете?', dance: '💃 Для кого танцуете?', booze: '🍸 Кого подпаиваете?' };
  const WIN = { town: ['🎉', 'Победили мирные', '#3ddc97'], mafia: ['🔪', 'Победила мафия', '#ff6b6b'],
                maniac: ['🪓', 'Победил маньяк', '#ff7a45'], draw: ['🌫', 'Ничья', '#a99cc6'], stop: ['⛔', 'Партия остановлена', '#a99cc6'] };
  const MAFIA = ['mafia', 'don', 'bartender'];
  const COLORS = ['#ff4fa3', '#ffb547', '#2aabee', '#3ddc97', '#b388ff', '#ff7a45', '#5ed6d6', '#f06292'];
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function decode() {
    const d = new URLSearchParams(location.search).get('d');
    if (!d) return null;
    try {
      const b = atob(d.replace(/-/g, '+').replace(/_/g, '/'));
      return JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
    } catch { return null; }
  }

  const data = decode();
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#140f1f'); tg.setBackgroundColor && tg.setBackgroundColor('#140f1f'); } catch { /* старый клиент */ } }
  if (!data || !ROLES[data.r]) {
    app.innerHTML = '<h2>Мафия 18+</h2><p class="muted">Откройте эту страницу кнопкой «🎭 Игра» в личке бота во время партии.</p>';
    return;
  }

  const P = data.p || {};
  const ids = Object.keys(P);
  const me = data.me;
  const st = data.st || (data.t ? 'night' : data.v ? 'vote' : 'day');
  const meAlive = me && P[me] ? !!P[me][1] : true;
  const [icon, roleName, color, about] = ROLES[data.r];
  document.documentElement.style.setProperty('--role', color);
  const colorOf = uid => COLORS[Math.max(0, ids.indexOf(uid)) % COLORS.length];
  const nameOf = uid => (P[uid] || ['?'])[0];
  const roleOf = uid => (P[uid] || [])[2];
  const initial = uid => esc((nameOf(uid).match(/[\p{L}\p{N}]/u) || ['?'])[0].toUpperCase());
  const av = (uid, extra = '') => `<span class="av" style="background:${colorOf(uid)}${extra}">${initial(uid)}</span>`;
  const tasks = data.t || {};
  const chosen = {};
  let vote = null;
  const events = data.ev || [];
  const lastOf = k => [...events].reverse().find(e => e.k === k);
  const secLeft = () => data.dl ? Math.max(0, Math.round(data.dl - Date.now() / 1000)) : 0;
  const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const haptic = kind => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch { /* */ } };

  // ---------- карточки событий ----------
  function morningCard(e) {
    const dead = e.dead || [];
    document.documentElement.style.setProperty('--hero', dead.length ? '#ff6b6b' : '#ffb547');
    return `<section class="hero">
      <div class="big" aria-hidden="true">${dead.length ? '🌅' : '☀️'}</div>
      <h2>Утро ${e.n}</h2>
      ${dead.length ? `<p>${dead.length > 1 ? 'Этой ночью погибли' : 'Этой ночью погиб(ла)'}:</p>
        <div class="people">${dead.map((u, i) => `<div class="person" style="animation-delay:${.2 + i * .15}s">${av(u)}
          <b>${esc(nameOf(u))}</b><span style="color:${(ROLES[roleOf(u)] || [])[2] || 'inherit'}">${(ROLES[roleOf(u)] || ['', '?'])[1]}${u === e.jl ? ' · 💍 ревность' : ''}</span></div>`).join('')}</div>`
        : `<p>${e.sv ? '💉 Доктор успел — все живы!' : 'Ночь прошла спокойно — все живы.'}</p>`}
      ${e.sl ? `<p class="small muted">💃 ${esc(nameOf(e.sl))} сегодня не голосует — после танца Стриптизёрши.</p>` : ''}
    </section>`;
  }

  function verdictCard(e) {
    const total = (e.ty || []).reduce((a, [, c]) => a + c, 0) || 1;
    document.documentElement.style.setProperty('--hero', e.x ? '#ff6b6b' : '#2aabee');
    return `<section class="hero">
      <div class="big" aria-hidden="true">${e.x ? '⚖️' : '🤷'}</div>
      <h2>Приговор, день ${e.d}</h2>
      ${e.x ? `<div class="people"><div class="person">${av(e.x)}<b>${esc(nameOf(e.x))}</b>
          <span style="color:${(ROLES[roleOf(e.x)] || [])[2] || 'inherit'}">${(ROLES[roleOf(e.x)] || ['', '?'])[1]}</span></div></div>
          <p>Город отправил на виселицу: <b>${esc(nameOf(e.x))}</b>.</p>`
        : '<p>Город не договорился — никого не казнили.</p>'}
      ${(e.ty || []).length ? `<div class="tally">${e.ty.map(([t, c]) => `<div class="bar"><i style="width:${Math.round(c / total * 100)}%"></i>
          <span>${t === 'skip' ? '🤷 Пропустить' : esc(nameOf(t))}</span><b>${c}</b></div>`).join('')}</div>` : ''}
    </section>`;
  }

  function finalCard() {
    const [ic, title, c] = WIN[data.w] || WIN.stop;
    document.documentElement.style.setProperty('--hero', c);
    const mine = data.w === 'town' ? !MAFIA.includes(data.r) && !['maniac', 'wife'].includes(data.r)
      : data.w === 'mafia' ? MAFIA.includes(data.r) : data.w === 'maniac' ? data.r === 'maniac' : false;
    const wife = data.ww && data.r === 'wife';
    return `<section class="hero">
      <div class="big" aria-hidden="true">${ic}</div>
      <h2>${title}</h2>
      ${data.w !== 'stop' && data.w !== 'draw' ? `<p><b>${mine || wife ? '🏆 Вы в команде победителей!' : 'В этот раз не ваша победа.'}</b></p>` : ''}
      ${data.ww ? '<p class="small">💍 Ревнивая жена дожила до конца вместе с мужем — она тоже победила.</p>' : ''}
      <p class="small muted">Все роли раскрыты — смотрите табло ниже. Ещё партию? /mafia в группе.</p>
    </section>`;
  }

  // ---------- действия ----------
  function nightPanel() {
    const open = secLeft() > 0 && Object.keys(tasks).length > 0;
    if (!open) return `<p class="note">${Object.keys(tasks).length ? '⏰ Время на ход вышло. Утром бот пришлёт новости — откройте «🎭 Игра» снова.'
                                                                      : '😴 Вы спите. Утром бот пришлёт новости — откройте «🎭 Игра» снова.'}</p>`;
    const ready = Object.keys(tasks).every(k => chosen[k]);
    return `<section class="panel">
      ${Object.entries(tasks).map(([k, targets]) => `<h2>${TASKS[k] || k}</h2>
        <div class="targets">${targets.map(uid => `<button class="target ${chosen[k] === uid ? 'on' : ''}" data-k="${k}" data-t="${esc(uid)}">
          ${av(uid)}<span class="nm">${esc(nameOf(uid))}</span></button>`).join('')}</div>`).join('')}
      <button class="send" id="send" ${ready ? '' : 'disabled'}>${ready ? 'Отправить ход' : 'Выберите цель'}</button>
      <p class="err" id="err"></p>
    </section>`;
  }

  function votePanel() {
    if (!data.v) return `<p class="note">${meAlive ? '💃 Сегодня вы не голосуете — после танца Стриптизёрши.' : '👻 Голосуют живые. Приговор пришлёт бот.'}</p>`;
    if (!secLeft()) return '<p class="note">⏰ Голосование закончилось. Приговор пришлёт бот — откройте «🎭 Игра» снова.</p>';
    return `<section class="panel">
      <h2>🗳 Кого казним? Голос тайный</h2>
      <p class="small muted">В группе видно только, сколько человек проголосовало.</p>
      <div class="targets">${data.v.concat('skip').map(uid => `<button class="target ${vote === uid ? 'on' : ''}" data-vote="${esc(uid)}">
        ${uid === 'skip' ? '<span class="av" style="background:#3a2d5c">🤷</span>' : av(uid)}
        <span class="nm">${uid === 'skip' ? 'Пропустить' : esc(nameOf(uid))}</span></button>`).join('')}</div>
      <button class="send" id="sendVote" ${vote ? '' : 'disabled'}>${vote ? 'Проголосовать' : 'Выберите, за кого'}</button>
      <p class="err" id="err"></p>
    </section>`;
  }

  // ---------- экран ----------
  function phaseTitle() {
    if (st === 'end') return 'Игра окончена';
    if (st === 'lobby') return 'Партия начинается';
    if (st === 'night') return `Ночь ${data.n}`;
    if (st === 'vote') return `День ${data.d} · голосование`;
    return `День ${data.d}`;
  }

  function main() {
    const out = [];
    if (st === 'end') {
      out.push(finalCard());
    } else if (st === 'lobby') {
      out.push('<p class="note">🌙 Роли розданы. Первая ночь вот-вот наступит — бот пришлёт сообщение, откройте «🎭 Игра» снова.</p>');
    } else if (st === 'night') {
      const v = lastOf('v');
      if (v && v.d === data.d && data.n > 1) out.push(verdictCard(v));
      if (meAlive) out.push(nightPanel());
    } else if (st === 'day') {
      const n = lastOf('n');
      if (n && n.n === data.n) out.push(morningCard(n));
      if (meAlive) out.push('<p class="note">💬 Обсуждаем в группе, кто тут мафия. Голосование начнётся по таймеру или раньше — по кнопке «К голосованию» в группе. Бот пришлёт сообщение — откройте «🎭 Игра».</p>');
    } else if (st === 'vote') {
      out.push(votePanel());
      const n = lastOf('n');
      if (n && n.n === data.n) out.push(morningCard(n));
    }
    if (!meAlive && st !== 'end') out.unshift('<p class="note dead">💀 Вы выбыли из игры и теперь зритель: видите новости и табло, но не ходите и не голосуете.</p>');
    if (data.nt && data.nt.length && st !== 'night') out.push(`<p class="note me">${data.nt.map(esc).join('<br>')}</p>`);
    return out.join('');
  }

  function roleBlock() {
    const open = st === 'night' && data.n <= 1 && !Object.keys(chosen).length;
    return `<details class="role" ${open ? 'open' : ''}>
      <summary><span class="ic" aria-hidden="true">${icon}</span><span><span class="eyebrow">Ваша роль</span><br><b>${roleName}</b></span><small>подробнее</small></summary>
      <div class="body">
        <p>${about}</p>
        <p class="goal">${GOALS[data.r] || 'Цель: вычислить и казнить всю мафию и маньяка.'}</p>
        ${data.m && data.m.length ? `<p class="mates">Ваша семья: ${data.m.map(esc).join(', ')}</p>` : ''}
        ${data.hb ? `<p class="mates">💍 Ваш муж: ${esc(data.hb)}</p>` : ''}
      </div>
    </details>`;
  }

  function townBlock() {
    const alive = ids.filter(u => P[u][1]).length;
    return `<section>
      <div class="eyebrow" style="margin-bottom:8px">Город · живых ${alive} из ${ids.length}</div>
      <div class="town">${ids.map(uid => {
        const r = roleOf(uid), dead = !P[uid][1];
        const label = r ? `<small style="color:${ROLES[r][2]}">${ROLES[r][0]} ${ROLES[r][1]}</small>` : `<small class="muted">${dead ? '' : 'в игре'}</small>`;
        return `<div class="${dead ? 'dead' : ''} ${uid === me ? 'self' : ''}">${av(uid)}
          <span class="who"><b>${dead ? '💀 ' : ''}${esc(nameOf(uid))}${uid === me ? ' (вы)' : ''}</b>${label}</span></div>`;
      }).join('')}</div>
    </section>`;
  }

  function render() {
    const left = secLeft();
    app.innerHTML = `
      <div class="eyebrow">Мафия 18+ · ${esc(data.g || '')}</div>
      <div class="top"><h1>${phaseTitle()}</h1>${data.dl && st !== 'end' ? `<span class="timer ${left ? '' : 'over'}" id="left">${left ? mmss(left) : 'время вышло'}</span>` : ''}</div>
      ${main()}
      ${roleBlock()}
      ${townBlock()}
      ${st === 'end' ? '' : '<p class="hint">Новая фаза — бот пришлёт сообщение. Нажмите «🎭 Игра» внизу чата, чтобы увидеть, что случилось.</p>'}
      <div class="bar-top">
        ${data.gl ? '<button class="chip" id="toGroup">↩️ В группу</button>' : ''}
        ${meAlive && st !== 'end' && st !== 'lobby' ? '<button class="chip quit" id="quit">🚪 Выйти из игры</button>' : ''}
      </div>
      <p class="err" id="err2"></p>`;
  }

  function send(payload, fallback, errId = 'err') {
    try {
      if (!tg || typeof tg.sendData !== 'function' || tg.platform === 'unknown') throw new Error('не в Telegram');
      tg.sendData(JSON.stringify(payload));  // Telegram передаст ход боту и закроет окно
    } catch {
      const el = document.getElementById(errId);
      if (el) el.textContent = fallback;
    }
  }

  function toGroup() {
    try {
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(data.gl); tg.close(); return; }
    } catch { /* старый клиент */ }
    location.href = data.gl;
  }

  function quit() {
    const go = ok => ok && send({ a: 'q', c: data.c }, 'Не удалось выйти отсюда. Напишите в группе /stop или попросите админа.', 'err2');
    const ask = 'Выйти из игры? Вы выбываете, ваша роль откроется всем.';
    try { if (tg && tg.showConfirm && tg.platform !== 'unknown') return tg.showConfirm(ask, go); } catch { /* */ }
    go(window.confirm(ask));
  }

  app.addEventListener('click', e => {
    if (e.target.id === 'toGroup') return toGroup();
    if (e.target.id === 'quit') return quit();
    const vb = e.target.closest('[data-vote]');
    if (vb) {
      vote = vb.dataset.vote;
      try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch { /* */ }
      return render();
    }
    if (e.target.id === 'sendVote') return send({ a: 'v', c: data.c, d: data.d, t: vote }, 'Не удалось отправить отсюда. Проголосуйте кнопками в группе.');
    const t = e.target.closest('.target');
    if (t) {
      chosen[t.dataset.k] = t.dataset.t;
      try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch { /* */ }
      return render();
    }
    if (e.target.id === 'send') send({ a: 'n', c: data.c, n: data.n, acts: chosen }, 'Не удалось отправить отсюда. Выберите кнопками в чате с ботом.');
  });

  render();
  if (st === 'end') haptic(['town', 'mafia', 'maniac'].includes(data.w) ? 'success' : 'warning');
  else if (st === 'day' && (lastOf('n') || {}).dead && lastOf('n').dead.length) haptic('warning');
  setInterval(() => {
    const el = document.getElementById('left');
    if (!el) return;
    const left = secLeft();
    if (left) el.textContent = mmss(left);
    else if (!el.classList.contains('over')) render();
  }, 1000);
})();
</script>
</body>
</html>
